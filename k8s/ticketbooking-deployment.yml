apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketbooking
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketbooking
  template:
    metadata:
      labels:
        app: ticketbooking
    spec:
      containers:
        - name: ticketbooking
          image: ticketbooking:1.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/ticketdb

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
                  
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
                  
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
                  
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 12
            periodSeconds: 10  
            
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20