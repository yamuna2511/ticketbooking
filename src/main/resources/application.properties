spring.application.name=ticketbooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
spring.datasource.username=${DB_USERNAME:ticketuser}
spring.datasource.password=${DB_PASSWORD:ticketpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.booking.ticketbooking.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.booking.ticketbooking.event.BookingConfirmedEvent
#logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG
#debug=true